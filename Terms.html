<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
@font-face{font-family:Arsenal;font-style:normal;font-weight:400;src:url('assets/fonts/arsenal-regular.woff2') format('woff2');font-display:swap;}
@font-face{font-family:Arsenal;font-style:normal;font-weight:700;src:url('assets/fonts/arsenal-bold.woff2') format('woff2');font-display:swap;}
@font-face{font-family:Archivo;font-style:normal;font-weight:100 900;src:url('assets/fonts/archivo_wght.woff2') format('woff2');font-display:swap;}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;src:url('assets/fonts/ibm-plex-sans-regular.woff2') format('woff2');font-display:swap;}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;src:url('assets/fonts/ibm-plex-sans-bold.woff2') format('woff2');font-display:swap;}
@font-face{font-family:"Space Mono";font-style:normal;font-weight:400;src:url('assets/fonts/space-mono-regular.woff2') format('woff2');font-display:swap;}
@font-face{font-family:"Space Mono";font-style:normal;font-weight:700;src:url('assets/fonts/space-mono-bold.woff2') format('woff2');font-display:swap;}
body{margin:0;background:#0b0b0a;}
@media (max-width:900px){
  .drm-page-head{font-size:48px !important;}
  .drm-nav{display:none !important;}
}
</style>
</helmet>

<div style="background:#0b0b0a;color:#f2ede4;font-family:'IBM Plex Sans',sans-serif;min-height:100vh;overflow-x:hidden">

  <site-header></site-header>

  <script src="/assets/header.js"></script>

  <section style="padding:90px 48px 30px;max-width:1000px;margin:0 auto">
    <div style="display:inline-block;transform:rotate(-3deg);border:3px solid #c81d2d;color:#c81d2d;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;padding:5px 14px;margin-bottom:22px">The fine print</div>
    <h1 class="drm-page-head" style="font-family:Arsenal,serif;font-weight:700;font-size:64px;line-height:0.98;margin:0 0 20px;text-transform:uppercase">Booking terms</h1>
    <p style="font-family:'Space Mono',monospace;font-size:15px;color:#cfc9bd;margin:0">No fuckery, just everything clear</p>
  </section>

  <section style="max-width:1000px;margin:50px auto 110px;padding:0 48px">
    <sc-for list="{{ terms }}" as="t" hint-placeholder-count="6">
      <div style="border-top:1px solid #2a2a28;padding:30px 0">
        <h3 style="font-family:Arsenal,serif;font-weight:700;font-size:22px;text-transform:uppercase;margin:0 0 10px">{{ t.title }}</h3>
        <p style="font-size:16px;line-height:1.7;color:#cfc9bd;margin:0">{{ t.body }}</p>
      </div>
    </sc-for>
    <div style="border-top:1px solid #2a2a28"></div>
  </section>

  <section id="Terms link" style="background:#141412;padding:110px 48px;border-top:1px solid #2a2a28;border-bottom:1px solid #2a2a28">
      <p style="text-align:center;font-family:'IBM Plex Sans',sans-serif;font-size:17px;line-height:2;color:#cfc9bd;margin:0">Full terms can be found <a href="https://docs.google.com/document/d/18VDUWN95znpHfBCJHHHeuXM2f783gjCm?rtpof=true&usp=drive_fs" style="color:#cfc9bd; text-decoration:underline;">here</a></p>

  </section>

  <section style="background:#c81d2d;padding:100px 48px;text-align:center">
    <div style="max-width:700px;margin:0 auto">
      <h2 style="font-family:Arsenal,serif;font-weight:700;font-size:40px;line-height:1.1;margin:0 0 22px;text-transform:uppercase;color:#0b0b0a">Got a question before booking?</h2>
      <a href="Contact.html" style="display:inline-block;background:#0b0b0a;color:#f2ede4;font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;padding:18px 34px">Ask before you book &rarr;</a>
    </div>
  </section>

  <footer style="padding:56px 48px 40px;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px">
      <div style="display:flex;align-items:center;gap:14px">
        <img src="assets/drm-logo.png" alt="DRM crest" style="height:34px;width:auto;filter:invert(1) brightness(1.6)"/>
        <span style="font-family:Arsenal,serif;font-weight:700;font-size:16px;letter-spacing:0.06em;text-transform:uppercase">Donny Reiher Music</span>
      </div>
      <div style="display:flex;gap:26px">
        <a href="https://www.instagram.com/heavymetalhausfrau/" style="color:#a8a196;text-decoration:none;font-family:'Space Mono',monospace;font-size:13px;text-transform:uppercase">Instagram</a>
        <a href="https://www.youtube.com/@donnyreiher" style="color:#a8a196;text-decoration:none;font-family:'Space Mono',monospace;font-size:13px;text-transform:uppercase">YouTube</a>
        <a href="https://open.spotify.com/artist/4KXXP4WTgnzQQQgv77cagF" style="color:#a8a196;text-decoration:none;font-family:'Space Mono',monospace;font-size:13px;text-transform:uppercase">Spotify</a>
      </div>
    </div>
    <div style="border-top:1px solid #2a2a28;padding-top:22px;font-family:'Space Mono',monospace;font-size:12px;color:#65605a">&copy; Donny Reiher Music &mdash; drums for all genres, angry or otherwise.</div>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
class Component extends DCLogic {
  renderVals() {
    return {
      terms: [
        { title: 'Live shows', body: 'Normally \u20AC150 plus travels for the show and two rehearsals. Discounts for recurring bands, weird genres, super easy stuff.' },
        { title: 'Studio sessions', body: 'Normally \u20AC40 per hour (max \u20AC320 per day).' },
        { title: 'Drum/Midi writing', body: 'Highly dependent on the song, context, so always negotioable (but never above \u20AC80 per song' },
        { title: 'Travel & lodging', body: '\u20AC5 based + \u20AC0.20 per km, including rehearsals. For anything requiring an overnight stay or long-distance travel, reasonable expenses are added to the quote up front.' },
        { title: 'Gear', body: 'I deliver a complete kit. If the venue or studio needs something specific or wants to reduce change-over time, let me know ahead of time.' },
        { title: 'Optional', body: 'If needed, I can help with arranging rehearsal spaces (Astrant, Ede, \u20AC27,50 per sessions), rental of equipment, studio time, live sound engineers, and more. ' },
        { title: 'Cancellations', body: 'Cancellation until 7 days of event: no problem. Within 7 days: 50% refund. Within 48 hours, no refunds. If something can be rescheduled, we can negotiate that.' },
        { title: 'Privacy', body: "I'll handle all your materials confidentially. Live sessions will be filmed and potentially published unless explicitly asked not to. If you want to film me, just let me know and it's fine." },
        { title: 'Open to discussions', body: "Everything is negotiable. I just want to play the drums, have fun playing, and make a little extra money if possible." }
      ]
    };
  }
}
</script>
</body>
</html>
